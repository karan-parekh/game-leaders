server {
  listen 80;
  root /usr/share/nginx/html;
  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location / { try_files $uri /index.html; }
}